services:
  api:
    build: .
    container_name: compliance-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - worker

  worker:
    build: .
    container_name: compliance-worker
    env_file:
      - .env
    command: celery -A src.tasks worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: compliance-redis
    ports:
      - "6379:6379"
